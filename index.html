<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=yes" />
    <title>Travasites | E-comm Web Developer — Custom Next.js + Supabase Stores</title>
    <meta name="description" content="Building, managing @Nextjs @Supabase and shipping @Vercel Business platforms that scale long term. Real builds, no templates." />
    <meta name="author" content="Travasites" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Travasites" />

    <!-- Compatibility hints -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:title" content="Travasites | E-comm Web Dev — Custom Next.js + Supabase Stores" />
    <meta property="og:description" content="Real builds, no templates. Custom e-commerce platforms built on Next.js + Supabase that scale long term." />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@travasites" />
    <meta name="twitter:creator" content="@travasites" />

    <!-- Performance & Fonts — Apple.com style system stack with Inter fallback -->
    <!-- Non-blocking font load: gracefully degrades offline (system fonts take over) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload main module -->
    <link rel="modulepreload" href="/src/main.tsx" />

    <!-- Critical inline styles — prevent FOUC (Flash of Unstyled Content) on all browsers -->
    <style>
      /* Immediate black background to prevent white flash on dark-themed sites */
      html, body { background-color: #000000; margin: 0; padding: 0; }
      #root { min-height: 100vh; background-color: #000000; }
      /* Prevent iOS Safari overscroll showing white background */
      html { overflow: hidden; height: 100%; }
      body { overflow: auto; height: 100%; -webkit-overflow-scrolling: touch; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view this site.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
